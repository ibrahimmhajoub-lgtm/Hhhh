<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>YT-DLP Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4">تحميل فيديو باستخدام yt-dlp</h2>
    <div class="card p-4 shadow-sm">
      <div class="mb-3">
        <input id="url" class="form-control" placeholder="أدخل رابط الفيديو">
      </div>
      <div class="d-flex justify-content-between mb-3">
        <button class="btn btn-primary" onclick="getFormats()">عرض الجودات</button>
        <select id="formats" class="form-select w-50"></select>
      </div>
      <button class="btn btn-success w-100" onclick="download()">تحميل</button>
    </div>
  </div>

  <script>
    async function getFormats() {
      const url = document.getElementById("url").value;
      const res = await fetch("/formats", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({url})
      });
      const data = await res.json();
      document.getElementById("formats").innerHTML = "";
      data.formats.split("\n").forEach(line => {
        if(line.trim() !== "") {
          const opt = document.createElement("option");
          opt.value = line.split(" ")[0];
          opt.text = line;
          document.getElementById("formats").appendChild(opt);
        }
      });
    }

    async function download() {
      const url = document.getElementById("url").value;
      const fmt = document.getElementById("formats").value;
      const res = await fetch("/download", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({url, format: fmt})
      });
      if(res.ok) {
        alert("بدأ التحميل...");
      }
    }
  </script>
</body>
</html>
